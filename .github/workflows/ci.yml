name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  # Decides which service tests to run: a change in libs/common or the root files runs all of them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        run: |
          all='["identity","catalog","land","media","quality","order","logistics","notification"]'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! git cat-file -e "$base" 2>/dev/null; then echo "services=$all" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$base" "${{ github.sha }}")
          if echo "$files" | grep -qE '^(libs/|pyproject.toml|uv.lock|\.github/)'; then
            echo "services=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          picked=$(echo "$files" | sed -n 's#^services/\([^/]*\)/.*#\1#p' | sort -u | jq -R . | jq -sc .)
          echo "services=$picked" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy libs/common/src services/*/src
      - name: OpenAPI specs are up to date
        run: uv run python scripts/export_openapi.py --check

  test-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run pytest libs/common seed

  test-service:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    # Catalog, media and order tests run against real PostgreSQL + PostGIS (see their conftest.py).
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: farm
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: farm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U farm -d farm_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://farm:change-me@localhost:5432/farm_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run pytest services/${{ matrix.service }}
